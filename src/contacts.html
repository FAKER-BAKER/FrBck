<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Название вашего сайта</title>
    <meta name="description" content="Свяжитесь с нами">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="contact_batton.css">
</head>
<body class="light-theme">
    <header>
        <a href="/">Логотип или название сайта</a>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
        <button class="theme-toggle" id="themeToggle">
            🌓 Сменить тему
        </button>
    </header>

    <main>
        <nav aria-label="Хлебные крошки">
            <a href="index.html">Главная</a> →
            <span>Контакты</span>
        </nav>

        <h1>Наши контакты</h1>
        <section>
            <h2>Список контактов</h2>
            <p>Перечисление работников...</p>
        </section>
        <section>
            <h2>Наша команда</h2>
            <p>Текст о команде...</p>
        </section>
        <div style="margin: 2rem 0;">
            <button class="contact-button" id="contactButton">
                Написать нам
            </button>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 Название вашего сайта. Все права защищены.</p>
        <p>Телефон: +7 (123) 456-78-90</p>
    </footer>

    <dialog id="contactForm">
        <div class="modal-content">
            <form method="dialog">
                <button class="close" aria-label="Закрыть">&times;</button>
            </form>
            <h2>Написать нам</h2>
            <form class="contact-form" id="contactDialogForm">
                <div class="form-group">
                    <label for="name">Ваше имя:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Ваш email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Телефон:</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="message">Сообщение:</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="submit-btn">Отправить</button>
                    <button type="button" class="cancel-btn" onclick="contactForm.close()">Отмена</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="jsmain.js"></script>
    <script src="contact_model.js"></script>
</body>
</html>
