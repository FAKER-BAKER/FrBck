<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Название вашего сайта</title>
    <meta name="description" content="Свяжитесь с нами">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        
        header {
            background: #f4f4f4;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 1rem;
        }
        
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
        #contactForm {
            border: none;
            border-radius: 8px;
            padding: 0;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .modal-content {
            padding: 0;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }
        
        .modal-body {
            padding: 1rem;
        }
        
        .close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        
        input, textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .form-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }
        
        .submit-btn, .cancel-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .submit-btn {
            background: #007bff;
            color: white;
        }
        
        .cancel-btn {
            background: #6c757d;
            color: white;
        }
        
        .contact-button {
            padding: 0.75rem 1.5rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        [aria-label="Хлебные крошки"] {
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        body.light-theme {
            background: white;
            color: black;
        }
        
        body.dark-theme {
            background: #333;
            color: white;
        }
        
        .dark-theme header {
            background: #444;
        }
        
        .dark-theme #contactForm {
            background: #444;
            color: white;
        }
        
        .dark-theme input,
        .dark-theme textarea {
            background: #555;
            color: white;
            border-color: #666;
        }
    </style>
</head>
<body class="light-theme">
    <header>
        <a href="/">Логотип или название сайта</a>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
        <button class="theme-toggle" id="themeToggle">
            🌓 Сменить тему
        </button>
    </header>

    <main>
        <nav aria-label="Хлебные крошки">
            <a href="index.html">Главная</a> →
            <span>Контакты</span>
        </nav>

        <h1>Наши контакты</h1>
        <section>
            <h2>Список контактов</h2>
            <p>Перечисление работников...</p>
        </section>
        <section>
            <h2>Наша команда</h2>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdKCtdS2BjR4sy4vnwvSTtWQBnRQL9e35utw&s" alt="Фотография нашей команды" class="team-photo">
            <p class="photo-caption"></p>
            <p>Текст о команде...</p>
        </section>
        <div style="margin: 2rem 0;">
            <button class="contact-button" id="contactButton">
                Написать нам
            </button>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 Название вашего сайта. Все права защищены.</p>
        <p>Телефон: +7 (123) 456-78-90</p>
    </footer>

    <dialog id="contactForm">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="margin: 0;">Написать нам</h2>
                <form method="dialog">
                    <button class="close" aria-label="Закрыть">&times;</button>
                </form>
            </div>
            <div class="modal-body">
                <form class="contact-form" id="contactDialogForm">
                    <div class="form-group">
                        <label for="name">Ваше имя:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Ваш email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Телефон:</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="message">Сообщение (комментарий):</label>
                        <textarea id="message" name="message" placeholder="Оставьте ваш комментарий или вопрос..." required></textarea>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="submit-btn">Отправить</button>
                        <button type="button" class="cancel-btn" onclick="document.getElementById('contactForm').close()">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
    </dialog>

    <script>
        document.getElementById('contactButton').addEventListener('click', function() {
            document.getElementById('contactForm').showModal();
        });

        document.getElementById('contactDialogForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                message: document.getElementById('message').value
            };

            console.log('Данные формы:', formData);
            alert('Спасибо! Ваше сообщение отправлено. Мы свяжемся с вами в ближайшее время.');
            document.getElementById('contactForm').close();

            this.reset();
        });

        document.getElementById('themeToggle').addEventListener('click', function() {
            document.body.classList.toggle('light-theme');
            document.body.classList.toggle('dark-theme');
        });
        document.getElementById('contactForm').addEventListener('click', function(e) {
            if (e.target === this) {
                this.close();
            }
        });
    </script>
</body>
</html>
